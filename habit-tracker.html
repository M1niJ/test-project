<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>습관 트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #222228;
    --border: #2e2e38;
    --accent: #7c6ef7;
    --accent2: #a78bfa;
    --green: #34d399;
    --amber: #fbbf24;
    --text: #f0eff8;
    --muted: #7b7a8e;
    --danger: #f87171;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* --- header --- */
  .top-bar {
    padding: 28px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .app-title {
    font-family: 'Gowun Dodum', serif;
    font-size: 26px;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .app-title span { color: var(--accent2); }
  .today-date {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .today-date strong { display: block; font-size: 22px; color: var(--text); font-weight: 700; }

  /* --- ring progress --- */
  .progress-section {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 28px 24px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .ring-wrap { flex-shrink: 0; position: relative; width: 80px; height: 80px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { stroke: var(--border); fill: none; stroke-width: 7; }
  .ring-fg { fill: none; stroke-width: 7; stroke-linecap: round;
    stroke-dasharray: 220; stroke-dashoffset: 220;
    transition: stroke-dashoffset 0.8s cubic-bezier(.4,0,.2,1);
  }
  .ring-pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: var(--text);
  }
  .progress-info { flex: 1; }
  .progress-info h2 { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .progress-info p { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .stat-pills { display: flex; gap: 8px; margin-top: 10px; }
  .pill {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    background: var(--surface2); color: var(--muted); border: 1px solid var(--border);
  }
  .pill.green { background: #064e3b22; color: var(--green); border-color: #065f4622; }
  .pill.amber { background: #78350f22; color: var(--amber); border-color: #92400e22; }

  /* --- week strip --- */
  .week-strip {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin: 20px 24px 0;
  }
  .day-dot {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .day-dot.today { border-color: var(--accent); background: #3730a320; }
  .day-name { font-size: 10px; color: var(--muted); }
  .day-dot.today .day-name { color: var(--accent2); font-weight: 700; }
  .day-num { font-size: 13px; font-weight: 700; color: var(--text); }
  .day-dot-indicator {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border);
  }
  .day-dot.today .day-dot-indicator { background: var(--accent); }

  /* --- section title --- */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin: 28px 24px 12px;
  }
  .section-header h3 { font-size: 13px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .section-header span { font-size: 12px; color: var(--muted); }

  /* --- habit cards --- */
  .habit-list { padding: 0 24px; display: flex; flex-direction: column; gap: 10px; }

  .habit-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    user-select: none;
  }
  .habit-card:hover { border-color: #3e3e52; }
  .habit-card.done {
    border-color: #065f4655;
    background: #064e3b18;
  }
  .habit-card.done .habit-name { text-decoration: line-through; color: var(--muted); }

  .check-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    cursor: pointer;
  }
  .habit-card.done .check-btn {
    border-color: var(--green);
    background: var(--green);
  }
  .check-icon {
    width: 14px; height: 14px;
    stroke: #fff; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.2s;
  }
  .habit-card.done .check-icon { opacity: 1; transform: scale(1); }

  .habit-emoji { font-size: 22px; flex-shrink: 0; }
  .habit-body { flex: 1; min-width: 0; }
  .habit-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .habit-meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .streak-badge {
    display: inline-flex; align-items: center; gap: 3px;
    background: #78350f22; color: var(--amber);
    padding: 2px 7px; border-radius: 10px; font-size: 11px;
  }

  .del-btn {
    width: 28px; height: 28px; border-radius: 8px;
    background: transparent; border: none; cursor: pointer;
    color: var(--muted); display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .habit-card:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--danger); }
  .del-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  /* --- add form --- */
  .add-section { padding: 20px 24px 0; }
  .add-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .add-box-title { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .add-row { display: flex; gap: 8px; }
  .add-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 14px;
    color: var(--text); font-family: inherit; outline: none;
    transition: border-color 0.15s;
  }
  .add-input:focus { border-color: var(--accent); }
  .add-input::placeholder { color: var(--muted); }
  .emoji-select {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 8px; font-size: 18px;
    cursor: pointer; outline: none; min-width: 48px; text-align: center;
  }
  .add-btn {
    background: var(--accent); border: none; border-radius: 10px;
    padding: 10px 18px; font-size: 14px; font-weight: 700;
    color: #fff; cursor: pointer; font-family: inherit;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .add-btn:hover { background: var(--accent2); }
  .add-btn:active { transform: scale(0.96); }

  /* --- empty state --- */
  .empty {
    text-align: center; padding: 40px 24px;
    color: var(--muted); font-size: 14px; line-height: 1.7;
  }
  .empty .empty-icon { font-size: 36px; margin-bottom: 12px; }

  /* --- confetti flash --- */
  @keyframes flash { 0%,100%{opacity:0} 50%{opacity:1} }
  .confetti-msg {
    text-align: center; font-size: 13px; color: var(--green);
    padding: 10px; margin: 8px 24px 0;
    background: #064e3b22; border: 1px solid #065f4633;
    border-radius: 10px; display: none;
    animation: flash 0.4s ease 2;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="app-title">나의 <span>습관</span></div>
  <div class="today-date">
    <strong id="day-num-big"></strong>
    <span id="today-str"></span>
  </div>
</div>

<!-- progress ring -->
<div class="progress-section">
  <div class="ring-wrap">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle class="ring-bg" cx="40" cy="40" r="35"/>
      <circle class="ring-fg" id="ring" cx="40" cy="40" r="35"/>
    </svg>
    <div class="ring-pct" id="pct-text">0%</div>
  </div>
  <div class="progress-info">
    <h2 id="progress-label">오늘의 달성률</h2>
    <p id="progress-sub">습관을 추가하고 하나씩 완료해보세요.</p>
    <div class="stat-pills">
      <span class="pill green" id="pill-done">완료 0개</span>
      <span class="pill amber" id="pill-streak">최장 스트릭 0일</span>
    </div>
  </div>
</div>

<!-- week strip -->
<div class="week-strip" id="week-strip"></div>

<div id="confetti-msg" class="confetti-msg">🎉 모든 습관 완료! 오늘도 최고예요!</div>

<!-- habit list -->
<div class="section-header">
  <h3>습관 목록</h3>
  <span id="habit-count">0개</span>
</div>
<div class="habit-list" id="habit-list"></div>

<!-- add form -->
<div class="add-section">
  <div class="add-box">
    <div class="add-box-title">+ 새 습관 추가</div>
    <div class="add-row">
      <select class="emoji-select" id="emoji-sel">
        <option>💧</option><option>🏃</option><option>📚</option>
        <option>🧘</option><option>✍️</option><option>🥗</option>
        <option>😴</option><option>🎸</option><option>💪</option>
        <option>🌿</option><option>☕</option><option>🧹</option>
      </select>
      <input class="add-input" id="new-habit" type="text" placeholder="예: 물 2L 마시기" maxlength="30">
      <button class="add-btn" id="add-btn">추가</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'habit_tracker_v2';
const today = new Date();

function getTodayKey() {
  return today.toISOString().slice(0, 10);
}

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { habits: [], log: {} }; } catch { return { habits: [], log: {} }; }
}
function save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

let data = load();
const todayKey = getTodayKey();

// --- init week strip ---
const weekEl = document.getElementById('week-strip');
const dayNames = ['일','월','화','수','목','금','토'];
for (let i = -3; i <= 3; i++) {
  const d = new Date(today);
  d.setDate(today.getDate() + i);
  const key = d.toISOString().slice(0,10);
  const isToday = i === 0;
  const div = document.createElement('div');
  div.className = 'day-dot' + (isToday ? ' today' : '');
  div.innerHTML = `<span class="day-name">${dayNames[d.getDay()]}</span>
    <span class="day-num">${d.getDate()}</span>
    <div class="day-dot-indicator"></div>`;
  weekEl.appendChild(div);
}

// date header
const dayNumBig = document.getElementById('day-num-big');
const todayStr = document.getElementById('today-str');
dayNumBig.textContent = today.getDate();
todayStr.textContent = `${today.getMonth()+1}월 · ${dayNames[today.getDay()]}요일`;

// --- render ---
function render() {
  const list = document.getElementById('habit-list');
  list.innerHTML = '';

  if (data.habits.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🌱</div>아직 습관이 없어요.<br>아래에서 첫 번째 습관을 추가해보세요!</div>`;
  } else {
    data.habits.forEach(h => {
      const done = (data.log[todayKey] || []).includes(h.id);
      const streak = calcStreak(h.id);
      const card = document.createElement('div');
      card.className = 'habit-card' + (done ? ' done' : '');
      card.innerHTML = `
        <button class="check-btn" aria-label="완료 토글">
          <svg class="check-icon" viewBox="0 0 14 14"><polyline points="2,7 5.5,11 12,3"/></svg>
        </button>
        <span class="habit-emoji">${h.emoji}</span>
        <div class="habit-body">
          <div class="habit-name">${h.name}</div>
          <div class="habit-meta">
            <span class="streak-badge">🔥 ${streak}일 연속</span>
          </div>
        </div>
        <button class="del-btn" aria-label="삭제">
          <svg viewBox="0 0 16 16"><polyline points="2,4 14,4"/><path d="M5,4V3h6v1M6,7v5M10,7v5"/><rect x="3" y="4" width="10" height="10" rx="2"/></svg>
        </button>`;
      card.querySelector('.check-btn').addEventListener('click', (e) => { e.stopPropagation(); toggle(h.id); });
      card.querySelector('.del-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteHabit(h.id); });
      card.addEventListener('click', () => toggle(h.id));
      list.appendChild(card);
    });
  }

  updateStats();
}

function calcStreak(id) {
  let streak = 0;
  const d = new Date(today);
  while (true) {
    const k = d.toISOString().slice(0,10);
    if ((data.log[k] || []).includes(id)) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function updateStats() {
  const total = data.habits.length;
  const doneIds = data.log[todayKey] || [];
  const done = data.habits.filter(h => doneIds.includes(h.id)).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const circumference = 220;
  const offset = circumference - (circumference * pct / 100);
  const ring = document.getElementById('ring');
  ring.style.strokeDashoffset = offset;
  ring.style.stroke = pct === 100 ? '#34d399' : pct > 50 ? '#a78bfa' : '#7c6ef7';
  document.getElementById('pct-text').textContent = pct + '%';
  document.getElementById('progress-sub').textContent =
    pct === 100 ? '오늘 모든 습관을 완료했어요! 🎉' :
    total === 0 ? '습관을 추가하고 시작해보세요.' :
    `${total}개 중 ${done}개 완료했어요.`;
  document.getElementById('pill-done').textContent = `완료 ${done}개`;
  const maxStreak = data.habits.length ? Math.max(...data.habits.map(h => calcStreak(h.id))) : 0;
  document.getElementById('pill-streak').textContent = `최장 스트릭 ${maxStreak}일`;
  document.getElementById('habit-count').textContent = `${total}개`;

  const confetti = document.getElementById('confetti-msg');
  confetti.style.display = (total > 0 && done === total) ? 'block' : 'none';
}

function toggle(id) {
  if (!data.log[todayKey]) data.log[todayKey] = [];
  const idx = data.log[todayKey].indexOf(id);
  if (idx === -1) data.log[todayKey].push(id);
  else data.log[todayKey].splice(idx, 1);
  save(data);
  render();
}

function deleteHabit(id) {
  data.habits = data.habits.filter(h => h.id !== id);
  Object.keys(data.log).forEach(k => {
    data.log[k] = data.log[k].filter(x => x !== id);
  });
  save(data);
  render();
}

document.getElementById('add-btn').addEventListener('click', () => {
  const inp = document.getElementById('new-habit');
  const emoji = document.getElementById('emoji-sel').value;
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  const id = Date.now();
  data.habits.push({ id, name, emoji });
  save(data);
  inp.value = '';
  render();
});
document.getElementById('new-habit').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('add-btn').click();
});

render();
</script>
</body>
</html>
